name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gitee synchronization guards
        run: npm run test:gitee-sync

      - name: Typecheck
        run: npm run typecheck

      - name: Workspace navigation regressions
        run: npm run test:workspace-navigation

      - name: Localization regressions
        run: npm run test:i18n

      - name: Plugin navigation regressions
        run: npm run test:plugin-navigation

      - name: Model navigation regressions
        run: npm run test:model-navigation

      - name: Local skill management regressions
        run: npm run test:skills

      - name: Session tab focus regressions
        run: npm run test:session-tab-focus

      - name: Conversation font regressions
        run: npm run test:conversation-font

      - name: Build renderer and main
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Verify release package integrity
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$releaseVersion") {
            throw 'Release tag must match the package version.'
          }
          npm run verify:release -- --dir dist --version "$releaseVersion" --report .qa-release/artifacts.json

      - name: List artifacts
        run: Get-ChildItem dist | Format-Table Name,Length
        shell: pwsh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harness-studio-windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
            .qa-release/artifacts.json
          if-no-files-found: warn
          include-hidden-files: true

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
